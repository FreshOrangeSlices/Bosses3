  slain: "<player> <gray>has slain</gray> <boss><gray>!</gray>"
  slain-unknown: "<boss> <gray>has fallen.</gray>"
  rewards: "<gray>The boss dropped:</gray> <items>"
  rune-applied: "<aqua>Empowered!</aqua> <gray>Your</gray> <item> <gray>gained</gray> <aqua><stat></aqua><gray>.</gray>"
  relic-bound: "<light_purple>Relic bound!</light_purple> <gray>Your</gray> <item> <gray>now carries</gray> <light_purple><relic></light_purple><gray>.</gray>"
