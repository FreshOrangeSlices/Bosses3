config-version: 9   # used by the plugin to update this file; don't change
# =====================================================================
#  Additional Bosses - configuration
# ---------------------------------------------------------------------
#  * Chances are percentages: 1.5 means 1.5%.
#  * Mob names use Minecraft's names (ZOMBIE, WITHER_SKELETON, ...).
#  * Sounds use Minecraft sound keys, optionally followed by volume and
#    pitch: "entity.wither.spawn 0.6 1.1". Leave "" for no sound.
#  * After editing, run /bosses reload (or restart the server).
#  All numbers here are starting points, not final balance.
# =====================================================================

bosses:
  enabled: true
  # Roll #1: chance that an eligible mob becomes a boss when it spawns.
  # (Roll #2, the rank, uses the weights in mob-categories below.)
  # Hostile mobs spawn (and quietly despawn) constantly, so small values
  # go a long way. Raise it for more bosses, lower it for fewer.
  spawn-chance: 15.0
  # Which spawns can become bosses. Spawners are left out on purpose so
  # mob farms can't farm bosses. Categories can override this list.
  spawn-reasons: [NATURAL, PATROL, RAID]
  worlds:
    # blacklist = every world except the ones listed
    # whitelist = only the worlds listed
    mode: blacklist
    list: []
  # These mobs never become bosses, even if listed in a category.
  excluded-mobs: []
  # Most bosses that can be loaded at the same time (all worlds).
  max-active: 15
  # A new boss can't appear within this many blocks of another boss.
  min-distance-between: 32
  # Bosses only appear within this many blocks above or below a player,
  # so they show up at your height instead of deep in a cave below you.
  # 0 = any height.
  max-height-difference: 20
  # Show the boss name above its head at all times (false = only when you
  # look at it; the boss bar shows it during a fight).
  always-show-name: false
  # (Boss armor is now set under boss-armor further down.)
  # Mob-themed particles around bosses (Blazes smoulder, Drowned drip,
  # skeletons shed bone dust, Endermen leak portal sparks...).
  environmental-particles: true
  # Seconds after the last hit before a player counts as out of combat
  # (their boss bar disappears).
  combat-timeout: 15
  # Only give rewards when a player took part in the fight.
  require-player-for-rewards: true

bossbar:
  # Engaged players within this many blocks see the boss bar.
  view-distance: 48
  # Show "❤ 85/100" next to the boss name in the bar.
  show-health-numbers: true

presentation:
  # Spawn announcements reach players within this many blocks.
  announce-radius: 48
  # Boss news in chat: spawns, kills, the drop list, Nemesis messages...
  # false = no chat; personal news shows above the hotbar instead.
  boss-chat: false

# =====================================================================
#  RANKS
#  stats:  health/damage/speed are multipliers; armor, armor-toughness,
#          knockback-resistance and size are added on top. min-health and
#          min-damage are floors: the least max health the boss has, and the
#          least its melee hits deal (a Warden has 500 health and hits for 30).
#  traits: how many traits the boss rolls, and how strong they are.
#  rewards: independent chances, each rolled separately on death.
#  gear:   what Boss Gear looks like for this rank. Material (CHAINMAIL,
#          IRON, GOLD, DIAMOND, NETHERITE...) and quality (CRUDE, STANDARD,
#          FINE, MASTERWORK) are separate rolls. Quality changes how many
#          enchantments the item gets and how high they go.
#  presentation:
#    announce:        NONE, ACTIONBAR, CHAT or TITLE (nearby players)
#    sound:           played on announce and when you first engage it
#    death-broadcast: NONE, NEARBY or SERVER
# =====================================================================
ranks:
  GRAY:
    name: Hard
    stats: { health: 1.6, damage: 1.2, armor: 2, armor-toughness: 0, knockback-resistance: 0.1, speed: 1.0, size: 0.15 }
    traits: { min: 1, max: 1, power: 1.0 }
    xp: { multiplier: 3, bonus: 10 }
    rewards: { boss-gear: 20, empowerment: 10, relic: 2, relic-catalyst: 0 }
    gear:
      materials: { CHAINMAIL: 40, IRON: 40, GOLD: 20 }
      quality: { CRUDE: 35, STANDARD: 50, FINE: 13, MASTERWORK: 2 }
      enchantments: { min: 1, max: 2 }
      min-level-percent: 30     # enchant levels roll from this % of the vanilla max up to the max
      over-max-chance: 0        # chance per enchantment to go above the vanilla max
      over-max-levels: 0        # how far above the vanilla max it can go
    persistent: false           # true = stops despawning once a player has fought it
    presentation: { announce: NONE, sound: "", death-sound: "", particles: 1, death-broadcast: NONE }

  GREEN:
    name: Very Hard
    stats: { health: 2.0, damage: 1.35, armor: 4, armor-toughness: 1, knockback-resistance: 0.2, speed: 1.05, size: 0.22 }
    traits: { min: 1, max: 2, power: 1.15 }
    xp: { multiplier: 4, bonus: 25 }
    rewards: { boss-gear: 30, empowerment: 18, relic: 4, relic-catalyst: 0 }
    gear:
      materials: { IRON: 55, GOLD: 25, DIAMOND: 20 }
      quality: { CRUDE: 25, STANDARD: 50, FINE: 20, MASTERWORK: 5 }
      enchantments: { min: 1, max: 3 }
      min-level-percent: 45
      over-max-chance: 0
      over-max-levels: 0
    persistent: true
    presentation: { announce: NONE, sound: "block.amethyst_block.resonate 1 0.8", death-sound: "entity.player.levelup 0.6 1.2", particles: 2, death-broadcast: NONE }

  RED:
    name: Brutal
    stats: { health: 2.75, damage: 1.55, armor: 6, armor-toughness: 2, knockback-resistance: 0.3, speed: 1.08, size: 0.3 }
    traits: { min: 2, max: 2, power: 1.3 }
    xp: { multiplier: 6, bonus: 50 }
    rewards: { boss-gear: 45, empowerment: 28, relic: 8, relic-catalyst: 0 }
    gear:
      materials: { IRON: 45, DIAMOND: 55 }
      quality: { CRUDE: 15, STANDARD: 45, FINE: 30, MASTERWORK: 10 }
      enchantments: { min: 2, max: 3 }
      min-level-percent: 60
      over-max-chance: 0
      over-max-levels: 0
    persistent: true
    presentation: { announce: ACTIONBAR, sound: "entity.evoker.prepare_summon 0.8 0.9", death-sound: "entity.player.levelup 0.8 1.0", particles: 2, death-broadcast: NEARBY }

  PURPLE:
    name: Nightmare
    stats: { health: 3.5, damage: 1.8, armor: 8, armor-toughness: 4, knockback-resistance: 0.45, speed: 1.1, size: 0.4 }
    traits: { min: 2, max: 3, power: 1.5 }
    xp: { multiplier: 8, bonus: 100 }
    rewards: { boss-gear: 65, empowerment: 40, relic: 15, relic-catalyst: 1.5 }
    gear:
      materials: { DIAMOND: 85, NETHERITE: 15 }
      quality: { CRUDE: 5, STANDARD: 40, FINE: 40, MASTERWORK: 15 }
      enchantments: { min: 2, max: 4 }
      min-level-percent: 80
      over-max-chance: 25
      over-max-levels: 1
    persistent: true
    presentation: { announce: CHAT, sound: "entity.elder_guardian.curse 0.5 1.0", death-sound: "ui.toast.challenge_complete 0.7 1.2", particles: 3, death-broadcast: NEARBY }

  GOLD:
    name: Legendary
    stats: { health: 6.0, damage: 2.4, armor: 10, armor-toughness: 6, knockback-resistance: 0.6, speed: 1.12, size: 0.5, min-health: 500, min-damage: 20 }
    traits: { min: 3, max: 4, power: 1.75 }
    xp: { multiplier: 12, bonus: 300 }
    rewards: { boss-gear: 100, empowerment: 60, relic: 30, relic-catalyst: 5 }
    gear:
      materials: { DIAMOND: 50, NETHERITE: 50 }
      quality: { CRUDE: 0, STANDARD: 25, FINE: 45, MASTERWORK: 30 }
      enchantments: { min: 3, max: 5 }
      min-level-percent: 100
      over-max-chance: 40
      over-max-levels: 2
    persistent: true
    presentation: { announce: TITLE, sound: "entity.wither.spawn 0.6 1.1", death-sound: "ui.toast.challenge_complete 1.0 1.0", particles: 4, death-broadcast: SERVER }

  ASCENDANT:
    # Never spawns naturally: a boss only becomes Ascendant when souls
    # promote it past Legendary. Drops waystones (see waystones below).
    name: Ascendant
    stats: { health: 10.0, damage: 3.0, armor: 14, armor-toughness: 8, knockback-resistance: 0.8, speed: 1.15, size: 0.65, min-health: 800, min-damage: 30 }
    traits: { min: 4, max: 5, power: 2.1 }
    xp: { multiplier: 20, bonus: 800 }
    rewards: { boss-gear: 100, empowerment: 100, relic: 60, relic-catalyst: 15 }
    gear:
      materials: { NETHERITE: 100 }
      quality: { FINE: 30, MASTERWORK: 70 }
      enchantments: { min: 4, max: 6 }
      min-level-percent: 100
      over-max-chance: 60
      over-max-levels: 3
    persistent: true
    presentation: { announce: TITLE, sound: "block.beacon.activate 1 0.6", death-sound: "ui.toast.challenge_complete 1 1.4", particles: 6, death-broadcast: SERVER }

# =====================================================================
#  MOB CATEGORIES - which mobs can become bosses, and their rank odds.
#  weights: roll #2 (rank). They don't have to add up to 100.
#  spawn-chance-multiplier: scales roll #1 for this category.
#  spawn-reasons (optional): replaces the global list for this category.
#  display-name / description: shown in the guide book.
# =====================================================================
mob-categories:
  common-overworld:
    display-name: Common Overworld
    weights: { GRAY: 40, GREEN: 30, RED: 18, PURPLE: 9, GOLD: 3 }
    # Rideable mobs (skeleton/zombie horses, camel husks...) can't be bosses.
    mobs: [BOGGED, BREEZE, CAVE_SPIDER, CREEPER, DROWNED, ENDERMAN, ENDERMITE, GUARDIAN, HUSK,
           PARCHED, PHANTOM, PILLAGER, SILVERFISH, SLIME, SPIDER, STRAY, VINDICATOR, WITCH,
           ZOMBIE_VILLAGER]

  zombie-skeleton:
    display-name: Zombie & Skeleton
    description: The most basic mobs are strangely likely to be Legendary.
    weights: { GRAY: 37, GREEN: 28, RED: 18, PURPLE: 9, GOLD: 8 }
    mobs: [ZOMBIE, SKELETON]

  nether:
    display-name: Nether
    weights: { GRAY: 15, GREEN: 35, RED: 30, PURPLE: 15, GOLD: 5 }
    mobs: [BLAZE, GHAST, HOGLIN, MAGMA_CUBE, WITHER_SKELETON, ZOGLIN]

  nether-crowd:
    display-name: Nether Crowds
    description: They spawn in huge numbers, so they roll lower.
    spawn-chance-multiplier: 0.5
    weights: { GRAY: 30, GREEN: 35, RED: 23, PURPLE: 10, GOLD: 2 }
    mobs: [PIGLIN, ZOMBIFIED_PIGLIN]

  dangerous:
    display-name: Dangerous
    # DEFAULT lets structure mobs (Elder Guardians, Piglin Brutes in bastions,
    # mansion illagers) roll once, the first time their chunk loads.
    spawn-reasons: [NATURAL, PATROL, RAID, DEFAULT]
    weights: { GRAY: 5, GREEN: 20, RED: 35, PURPLE: 30, GOLD: 10 }
    mobs: [PIGLIN_BRUTE, ELDER_GUARDIAN, RAVAGER, EVOKER, ILLUSIONER]

  native-bosses:
    display-name: Native Bosses
    description: Already bosses in vanilla, so they start at Brutal.
    enabled: false              # set to true to allow Warden/Wither boss variants
    spawn-reasons: [NATURAL, BUILD_WITHER]
    weights: { RED: 50, PURPLE: 35, GOLD: 15 }
    mobs: [WARDEN, WITHER]

# =====================================================================
#  MOB PROFILES - how strongly rank stats apply to some mob families.
#  1.0 = full rank bonus, 0.5 = half the bonus, 0 = none.
#  (defense covers armor, armor toughness and knockback resistance.)
#  Mobs not listed use 1.0 for everything.
# =====================================================================
mob-profiles:
  explosive:
    mobs: [CREEPER]
    health: 1.0
    damage: 0.5
    defense: 1.0
    speed: 0.5
    size: 1.0
  small:
    mobs: [SILVERFISH, ENDERMITE, CAVE_SPIDER, VEX]
    health: 0.6
    damage: 1.0
    defense: 0.5
    speed: 0.5
    size: 1.5
  large:
    mobs: [RAVAGER, ELDER_GUARDIAN, HOGLIN, ZOGLIN, GHAST, PIGLIN_BRUTE]
    health: 0.8
    damage: 0.8
    defense: 1.0
    speed: 0.5
    size: 0.4
  flying:
    mobs: [PHANTOM, BLAZE, BREEZE]
    health: 1.0
    damage: 1.0
    defense: 0.5
    speed: 0.0
    size: 1.0
  native-boss:
    mobs: [WARDEN, WITHER]
    health: 0.5
    damage: 0.5
    defense: 0.5
    speed: 0.0
    size: 0.0

# =====================================================================
#  TRAITS - combat behaviour. "weight" = how often it is picked.
#  Every trait can be turned off with enabled: false.
#  Higher ranks multiply most numbers below by their trait "power".
# =====================================================================
traits:
  # Pairs that can never appear on the same boss.
  incompatible:
    - [leaping, blinking]
    - [leaping, charging]
    - [blinking, charging]

  # ---- Offense ----
  berserk:      { enabled: true, weight: 10, health-threshold: 50, damage-bonus: 35, speed-bonus: 20 }
  vampiric:     { enabled: true, weight: 10, heal-percent: 25 }
  venomous:     { enabled: true, weight: 8, effect-seconds: 4, amplifier: 1 }
  executioner:  { enabled: true, weight: 8, health-threshold: 40, damage-bonus: 50 }
  deadeye:      { enabled: true, weight: 12, projectile-speed-bonus: 40, damage-bonus: 25 }   # ranged mobs only
  volley:       { enabled: true, weight: 12, extra-arrows: 2, spread: 8 }                      # archers only
  # ---- Defense ----
  bulwark:      { enabled: true, weight: 10, damage-reduction: 20 }
  regenerating: { enabled: true, weight: 8, heal-percent-per-second: 1.5, delay-seconds: 4 }
  warded:       { enabled: true, weight: 8, block-chance: 50 }
  undying:      { enabled: true, weight: 6, revive-health-percent: 50 }
  thorned:      { enabled: true, weight: 8, reflect-percent: 20 }
  # ---- Movement ----
  swift:        { enabled: true, weight: 10, speed-bonus: 25 }
  leaping:      { enabled: true, weight: 8, cooldown-seconds: 6, min-distance: 4, max-distance: 14, strength: 1.0 }
  blinking:     { enabled: true, weight: 6, cooldown-seconds: 8, min-distance: 7 }
  charging:     { enabled: true, weight: 6, cooldown-seconds: 10, duration-seconds: 2.5, damage-bonus: 30, knockback: 1.0 }
  # ---- Control ----
  frostbound:   { enabled: true, weight: 8, effect-seconds: 3, amplifier: 1 }
  shadowed:     { enabled: true, weight: 6, effect-seconds: 4 }
  gravitic:     { enabled: true, weight: 5, cooldown-seconds: 8, radius: 10, strength: 0.9 }
  quaking:      { enabled: true, weight: 6, cooldown-seconds: 9, radius: 5, damage: 4, knockback: 1.1 }
  # ---- Special ----
  summoner:     { enabled: true, weight: 6, minions: 2, health-thresholds: [75, 50, 25] }
  volatile:     { enabled: true, weight: 25, explosion-radius-bonus: 2, fuse-reduction: 30 }   # creepers only
  infernal:     { enabled: true, weight: 6, ignite-seconds: 4 }

# =====================================================================
#  BOSS GEAR - the one special equipment item a boss can drop.
# =====================================================================
boss-gear:
  # How often each kind of item is chosen.
  item-weights: { SWORD: 20, AXE: 12, SPEAR: 8, MACE: 2, BOW: 8, CROSSBOW: 5, TRIDENT: 2,
                  HELMET: 11, CHESTPLATE: 11, LEGGINGS: 11, BOOTS: 11,
                  PICKAXE: 6, SHOVEL: 4, HOE: 3 }
  # Chance (%) a boss pickaxe/shovel/hoe also rolls a weapon enchantment
  # (Sharpness, Smite, Fire Aspect...) on top of its utility enchantments.
  tool-offensive-enchant-chance: 35
  # Extra weight added for certain mobs (skeletons tend to drop bows...).
  mob-preferences:
    SKELETON: { BOW: 40 }
    STRAY: { BOW: 40 }
    BOGGED: { BOW: 40 }
    PARCHED: { BOW: 40 }
    PILLAGER: { CROSSBOW: 40 }
    PIGLIN: { CROSSBOW: 20, SWORD: 10 }
    DROWNED: { TRIDENT: 30 }
    VINDICATOR: { AXE: 40 }
    PIGLIN_BRUTE: { AXE: 40 }
    WITHER_SKELETON: { SWORD: 30 }
    BREEZE: { MACE: 15 }
  allow-curse-enchantments: false
  # From this rank up, enchantments that normally exclude each other can
  # roll together (Sharpness + Smite, Protection + Blast Protection...).
  # NONE to turn off.
  overlapping-enchantments-from: GOLD
  # Enchantments that are never rolled, e.g. [mending, "minecraft:infinity"]
  excluded-enchantments: []

# =====================================================================
#  EMPOWERMENT - runes that add a permanent stat to an item.
#  applies-to: ANY, WEAPON, MELEE, RANGED, ARMOR, HELMET, CHESTPLATE,
#              LEGGINGS, BOOTS, SHIELD, TOOL
#  operation:  ADD_NUMBER (flat), ADD_SCALAR (% of base value)
#  percent:    show the amount as a percentage in lore
#  values:     the amount a rune carries, by the dropping boss's rank.
#              Every rune of the same stat and rank is identical, so they
#              stack. (Older "ranges: [min, max]" still work: with
#              fixed-values on, the rune carries the max.)
# =====================================================================
empowerment:
  # How many runes one item can hold.
  max-per-item: 2
  # false = runes roll a random amount inside "ranges" (they won't stack).
  fixed-values: true
  # Loot and Fortune runes multiply drops; the total is capped here.
  max-loot-multiplier: 3
  max-fortune-multiplier: 3
  stats:
    loot:
      # Multiplies normal mob drops when this weapon gets the kill
      # (never boss rewards or gear the mob was wearing).
      effect: loot
      display: Mob Loot
      weight: 8
      applies-to: [WEAPON]
      values: { GRAY: 0.1, GREEN: 0.15, RED: 0.2, PURPLE: 0.3, GOLD: 0.4, ASCENDANT: 0.5 }
    fortune:
      # Multiplies ore drops when this tool breaks the ore (stacks with the
      # Fortune enchantment; silk-touched blocks are never multiplied).
      effect: fortune
      display: Ore Drops
      weight: 8
      applies-to: [TOOL]
      values: { GRAY: 0.1, GREEN: 0.15, RED: 0.2, PURPLE: 0.3, GOLD: 0.4, ASCENDANT: 0.5 }
    reach:
      # Extra attack and block reach while held. Keep it small if your
      # server runs an anti-cheat.
      attribute: entity_interaction_range
      extra-attribute: block_interaction_range
      operation: ADD_NUMBER
      display: Reach
      weight: 6
      applies-to: [MELEE, TOOL]
      values: { GRAY: 0.5, GREEN: 0.75, RED: 1.0, PURPLE: 1.25, GOLD: 1.5, ASCENDANT: 2.0 }
    attack-damage:
      attribute: attack_damage
      operation: ADD_NUMBER
      display: Attack Damage
      weight: 20
      applies-to: [MELEE]
      values: { GRAY: 1, GREEN: 1.5, RED: 2, PURPLE: 3, GOLD: 4, ASCENDANT: 5 }
    attack-speed:
      attribute: attack_speed
      operation: ADD_NUMBER
      display: Attack Speed
      weight: 12
      applies-to: [MELEE]
      values: { GRAY: 0.1, GREEN: 0.15, RED: 0.2, PURPLE: 0.3, GOLD: 0.4, ASCENDANT: 0.5 }
    max-health:
      attribute: max_health
      operation: ADD_NUMBER
      display: Max Health
      weight: 15
      applies-to: [ARMOR, SHIELD, RANGED]
      values: { GRAY: 1, GREEN: 2, RED: 3, PURPLE: 4, GOLD: 6, ASCENDANT: 8 }
    armor:
      attribute: armor
      operation: ADD_NUMBER
      display: Armor
      weight: 15
      applies-to: [ARMOR, SHIELD]
      values: { GRAY: 1, GREEN: 1.5, RED: 2, PURPLE: 3, GOLD: 4, ASCENDANT: 5 }
    armor-toughness:
      attribute: armor_toughness
      operation: ADD_NUMBER
      display: Armor Toughness
      weight: 10
      applies-to: [ARMOR]
      values: { GRAY: 1, GREEN: 1.5, RED: 2, PURPLE: 2.5, GOLD: 3, ASCENDANT: 4 }
    knockback-resistance:
      attribute: knockback_resistance
      operation: ADD_NUMBER
      display: Knockback Resistance
      percent: true
      weight: 8
      applies-to: [ARMOR]
      values: { GRAY: 0.04, GREEN: 0.06, RED: 0.08, PURPLE: 0.1, GOLD: 0.15, ASCENDANT: 0.2 }
    movement-speed:
      attribute: movement_speed
      operation: ADD_SCALAR
      display: Movement Speed
      percent: true
      weight: 8
      applies-to: [BOOTS, LEGGINGS, RANGED]
      values: { GRAY: 0.03, GREEN: 0.04, RED: 0.06, PURPLE: 0.08, GOLD: 0.1, ASCENDANT: 0.12 }

# =====================================================================
#  RELICS - permanent unique abilities bound to equipment.
#  Every relic always has 1 good effect. corruption-chance adds 1 curse
#  on top (the curse doesn't use a relic slot).
# =====================================================================
relics:
  base-slots: 1
  corruption-chance: 10
  # false = you only discover a curse when you bind the relic.
  reveal-corruption: false
  # Binding is permanent, so ask the player to confirm (click twice).
  confirm-binding: true
  # Can the same relic be bound twice to one item (needs 2 slots)?
  allow-duplicates-on-item: false
  catalyst:
    # Relic Catalyst: an extremely rare drop that adds +1 relic slot.
    enabled: true
    max-slots: 2
    # A Catalyst draws corruption: a relic bound to an item that holds one
    # carries a curse this often (in total, instead of corruption-chance).
    corruption-chance: 50
  # Cursed armor also gets Curse of Binding: once worn, only death takes it off.

  effects:
    blood-pact:    { enabled: true, weight: 10, heal-percent: 12 }
    soul-harvest:  { enabled: true, weight: 10, heal: 3, boss-heal: 12 }   # health points (2 = 1 heart)
    second-dawn:   { enabled: true, weight: 5, cooldown-minutes: 10 }
    bramble-heart: { enabled: true, weight: 8, reflect-percent: 25 }
    emberheart:    { enabled: true, weight: 8, ignite-seconds: 4 }
    frostbite:     { enabled: true, weight: 8, slow-seconds: 2, amplifier: 1 }
    stormcaller:   { enabled: true, weight: 2, chance: 10, bonus-damage: 4 }
    windstep:      { enabled: true, weight: 8, cooldown-seconds: 4, strength: 1.2 }
    hunters-mark:  { enabled: true, weight: 6, reward-chance-bonus: 25, boss-damage-bonus: 10 }
    echo-strike:   { enabled: true, weight: 8, chance: 15, echo-damage-percent: 50 }
    owls-sight:    { enabled: true, weight: 6 }
    lodestone:     { enabled: true, weight: 6, radius: 6 }
    aegis:         { enabled: true, weight: 8, health-threshold: 30, absorption-level: 2, duration-seconds: 10, cooldown-seconds: 60 }
    featherweight: { enabled: true, weight: 6, fall-reduction: 75 }
    prospector:    { enabled: true, weight: 6, xp-bonus: 50 }
    # Auras: a potion effect while equipped (some only under a condition). "level" is the effect level.
    iron-will:      { enabled: true, weight: 4, level: 1 }   # Resistance
    blood-mending:  { enabled: true, weight: 5, level: 1 }   # Regeneration
    skybound:       { enabled: true, weight: 6, level: 2 }   # Jump Boost
    ember-ward:     { enabled: true, weight: 6, level: 1 }   # Fire Resistance
    tidebound:      { enabled: true, weight: 5, level: 1 }   # Conduit Power, in water
    ocean-grace:    { enabled: true, weight: 5, level: 1 }   # Dolphin's Grace, in water
    villager-favor: { enabled: true, weight: 5, level: 1 }   # Hero of the Village (trade discounts)
    miners-favor:   { enabled: true, weight: 6, level: 1 }   # Haste, holding a tool or underground
    nightstalker:   { enabled: true, weight: 6, level: 1 }   # Speed, at night or in the dark
    sunblessed:     { enabled: true, weight: 6, level: 1 }   # Regeneration, in sunlight
    # Burdened: good relics with a built-in drawback.
    greed:          { enabled: true, weight: 5, extra-drop-chance: 40, hunger-drain-seconds: 20 }
    heavy-crown:    { enabled: true, weight: 5, armor: 4, knockback-resistance: 0.5, speed-penalty: 15 }

  curses:
    dread:         { enabled: true, weight: 10, chance: 20, duration-seconds: 3, lightning-chance-per-second: 1, lightning-cooldown-seconds: 60 }
    butterfingers: { enabled: true, weight: 6, chance: 2 }
    fowl-omen:     { enabled: true, weight: 8, chance: 5, cooldown-seconds: 15 }
    insomnia:      { enabled: true, weight: 8 }
    limelight:     { enabled: true, weight: 8 }
    gluttony:      { enabled: true, weight: 8, exhaustion: 0.8 }
    recoil:        { enabled: true, weight: 8, strength: 0.45 }
    glass-bones:   { enabled: true, weight: 8, fall-multiplier: 2.0 }
    blood-tithe:   { enabled: true, weight: 6, health-cost: 1.0 }
    terror:        { enabled: true, weight: 8, chance-per-second: 2, cooldown-seconds: 90, darkness-seconds: 5 }
    echoes:        { enabled: true, weight: 8, chance-per-second: 3, cooldown-seconds: 45 }
    reduction:     { enabled: true, weight: 6, size: 0.55, reach-penalty: 1.0 }
    matador:       { enabled: true, weight: 6, radius: 16, knockback: 1.2 }
    mother-hen:    { enabled: true, weight: 6, chicks: 5 }
    pariah:        { enabled: true, weight: 6, radius: 12, flee-speed: 2.0, speed-level: 3, villager-price-penalty: 40 }   # animals bolt (you can't catch them), worse trades, fishing gives only treasure
    herbivore:     { enabled: true, weight: 6 }   # can't eat meat or fish; it turns into coal, seeds or berries
    withering-waters: { enabled: true, weight: 6, level: 1, seconds: 3 }   # rain and water give you Wither, like an Enderman
    uninvited-guest:  { enabled: true, weight: 6, chance-per-second: 1, cooldown-seconds: 480 }   # a wandering trader only you can see walks up behind you... then a shriek
    dont-blink:       { enabled: true, weight: 6, chance-per-second: 1.5, cooldown-seconds: 300, lifetime-seconds: 45, stare-seconds: 4 }   # a weeping angel (Creaking) follows you in the dark
    poltergeist:      { enabled: true, weight: 6, chance-per-second: 2, cooldown-seconds: 60 }   # shuffles your hotbar, opens doors near you
    restless-dead:    { enabled: true, weight: 6, chance: 30 }   # undead you kill may get back up (no drops the second time)
    hiccups:          { enabled: true, weight: 6, chance-per-second: 4, cooldown-seconds: 8 }   # *hic* - a little hop now and then

# =====================================================================
#  LAST STAND - Purple and Gold bosses (and every Nemesis) fight harder
#  once, when they drop low: stronger traits, faster, and a dormant trait
#  wakes up.
# =====================================================================
last-stand:
  ranks: [PURPLE, GOLD, ASCENDANT]
  health-percent: 25
  trait-power-bonus: 50   # % stronger traits
  speed-bonus: 15         # % faster
  awaken-dormant-trait: true

# =====================================================================
#  RANK PERSONALITY - Red and higher bosses surge after a target that
#  backs off (Purple, Gold and Nemesis bosses harder). Higher ranks also
#  notice players from further away.
# =====================================================================
rank-personality:
  pursuit: true

# =====================================================================
#  ANTI-TRAP - bosses can't be put in boats/minecarts or leashed, and a
#  boss that can't reach you for a while tears itself free (teleports
#  next to you, or drags you off a pillar).
# =====================================================================
anti-trap:
  block-vehicles-and-leads: true
  unstuck:
    enabled: true
    seconds: 6

# =====================================================================
#  HUNTER'S COMPASS - hold it to track the nearest boss. Shows distance
#  and which way to turn; the boss's name/rank only shows up close.
#  Crafted from a Compass + Eye of Ender + Bone. Click an Empowerment
#  Rune onto it to upgrade (the last tier needs a Red rune or better).
# =====================================================================
hunters-compass:
  enabled: true
  recipe: true
  tiers:
    - {range: 150, reveal-rank-within: 40}
    - {range: 300, reveal-rank-within: 100}
    - {range: 600, reveal-rank-within: 600}

# =====================================================================
#  BOSS TOTEM - a rare drop. Right-click it to summon a boss (3 second
#  ritual). Totems dropped by bosses call a random rank.
# =====================================================================
boss-totem:
  enabled: true
  drop-chance:      # % per boss kill
    GRAY: 1
    GREEN: 1.5
    RED: 2.5
    PURPLE: 4
    GOLD: 8
  rank-weights:     # rank of the summoned boss
    GRAY: 0
    GREEN: 30
    RED: 35
    PURPLE: 25
    GOLD: 10

# =====================================================================
#  ESCALATION CHAIN - kill enough bosses within one Minecraft day and
#  something worse comes looking for you.
# =====================================================================
escalation:
  enabled: true
  kills: 5
  within-days: 1
  bosses: 2
  delay-seconds: 10
  rank-weights:
    PURPLE: 70
    GOLD: 30

# =====================================================================
#  BOSS SOULS - a stackable soul of the boss's rank. Chance per kill; a
#  Nemesis always drops one. Offer it to a boss to promote it (below).
# =====================================================================
souls:
  enabled: true
  chance:
    GRAY: 4
    GREEN: 7
    RED: 12
    PURPLE: 25
    GOLD: 100
    ASCENDANT: 100

# =====================================================================
#  NEMESIS - a boss that kills you (or that you flee from after a real
#  fight) becomes YOUR Nemesis, with a name of its own ("Scrawl the
#  Bulwark"). It prowls off, grows, earns titles and counter-traits, and
#  comes back for you after a few Minecraft days.
#  It ignores the boss cap and never despawns while it is out. Killing
#  it drops guaranteed loot plus a Nemesis Statue of it.
# =====================================================================
nemesis:
  enabled: true
  become-on-kill-chance: 100      # % when a boss kills you
  become-on-escape-chance: 50     # % when you flee from a boss
  escape-min-rank: RED            # fleeing only counts against Red or higher
  escape-min-damage-percent: 25   # ...after you dealt this % of its health
  escape-distance: 80             # an active Nemesis loses you past this
  max-per-player: 5
  max-level: 50
  levels-when-it-kills-you: 3
  levels-when-you-flee: 1
  levels-per-rank-up: 4           # it climbs one rank every N levels
  levels-per-new-trait: 3         # and learns a new trait every N levels
  max-traits: 7
  returns-after-days: 3
  health-per-level: 8             # % extra health per level
  damage-per-level: 4             # % extra damage per level
  max-damage-multiplier: 5
  trait-power-per-level: 3        # % stronger traits per level
  size-per-level: 0.02
  max-extra-size: 0.5
  revenge-xp-multiplier: 2        # XP bonus for killing the boss that killed you
  gear-evolution: true            # chainmail -> iron -> diamond -> netherite (trimmed) as it levels
  statue-scale: 0.5               # placed Nemesis Statues: 0.5 = half the size of a normal mob of that kind
  prowl-minutes: 1                # after it lets you go, it roams nearby hunting other mobs before vanishing
  levels-from-kills-per-outing: 5 # each mob it kills is +1 level, up to this many per outing

# =====================================================================
#  DIFFICULTY - on top of the rank stats. Threat Scaling: the first time a
#  boss is engaged it sizes up the best-geared player nearby (armor,
#  enchantments, runes, relics) and gets stronger to match, and pays
#  better too. A fully kitted player scores about full-gear-score.
# =====================================================================
difficulty:
  health-multiplier: 1.3
  damage-multiplier: 1.2
  threat-scaling:
    enabled: true
    max-health-bonus: 60     # %
    max-damage-bonus: 30     # %
    max-reward-bonus: 25     # % better reward odds
    full-gear-score: 110
    radius: 32

# =====================================================================
#  REWARD FLOOR - from this rank up, a boss always drops at least one
#  item (gear or a rune). Below it, a player who gets nothing several
#  kills in a row is guaranteed a drop on the next one.
# =====================================================================
reward-floor:
  guaranteed-from: RED       # NONE to turn off
  pity-after-empty-kills: 3  # 0 to turn off

# =====================================================================
#  PROMOTION - right-click a boss with a Boss Soul, or throw (drop) the
#  soul at it, and the boss rises. Ranks can be skipped. Promoting past
#  Legendary makes it Ascendant.
#  ranks-gained: [min, max] by the rank of the soul.
# =====================================================================
promotion:
  enabled: true
  gray-soul-chance: 25       # % that a Gray soul works at all
  ranks-gained:
    GRAY: [1, 1]
    GREEN: [1, 1]
    RED: [1, 2]
    PURPLE: [1, 3]
    GOLD: [2, 4]
    ASCENDANT: [3, 5]

# =====================================================================
#  ASCENDANT - the top rank. At each health mark it breaks into a new
#  phase: a shockwave throws players back and it gains another trait.
# =====================================================================
ascendant:
  phases:
    enabled: true
    at-health-percent: [66, 33]
    shockwave-radius: 7
    shockwave-damage: 6

# =====================================================================
#  WAYSTONES - Ascendant bosses drop them. Place one and it joins a
#  single public network: every waystone, from every player, can reach
#  every other one, for free. Rename the item in an anvil to name it (or
#  use a name tag on the placed stone). Sneak + right-click the stone
#  with any item to set its menu icon. Only its owner (or an admin) can
#  break it; explosions and pistons can't.
# =====================================================================
waystones:
  enabled: true
  ascendant-drops: 2
  drop-chance:               # extra % chance per kill, by rank
    GOLD: 3
  warmup-seconds: 3          # stand still; taking damage cancels it
  cooldown-seconds: 5
  cross-dimension: true
  blocked-during-boss-fights: true

# =====================================================================
#  BOSS ARMOR - zombies, skeletons and piglins wear a matching set: one
#  material, one trim colour and one random trim pattern for every piece.
#  Purely cosmetic (no armor points) and never drops.
#  Palette entries: "<ARMOR MATERIAL> <trim colour>". Trim colours:
#  quartz, iron, netherite, redstone, copper, gold, emerald, diamond,
#  lapis, amethyst, resin.
# =====================================================================
boss-armor:
  enabled: true
  palettes:
    GRAY: ["CHAINMAIL iron", "CHAINMAIL quartz", "CHAINMAIL copper"]
    GREEN: ["COPPER emerald", "IRON emerald", "IRON copper"]
    RED: ["IRON redstone", "DIAMOND redstone", "IRON netherite"]
    PURPLE: ["DIAMOND amethyst", "NETHERITE amethyst", "DIAMOND lapis"]
    GOLD: ["GOLDEN redstone", "NETHERITE gold", "DIAMOND gold"]
    ASCENDANT: ["NETHERITE quartz", "DIAMOND quartz", "NETHERITE diamond"]
  trim-patterns: [sentry, dune, coast, wild, ward, eye, vex, tide, snout, rib, spire, wayfinder,
                  shaper, silence, raiser, host, flow, bolt]

# =====================================================================
#  ITEMS - what the special drops look like.
#  (They can't be used in crafting recipes.)
# =====================================================================
items:
  rune-material: AMETHYST_SHARD
  relic-material: HEART_OF_THE_SEA
  catalyst-material: NETHER_STAR

guide:
  # Give every player the Boss Hunter's Compendium the first time they join.
  give-on-first-join: true

# =====================================================================
#  MESSAGES (MiniMessage format: <red>, <bold>, <gradient:...>, etc.)
#  Placeholders: <boss> <player> <rank> <items> <item> <stat> <relic>
#                <curse> <count> <fits> <name> <owner>
# =====================================================================
messages:
  prefix: "<dark_gray>[<gold>Bosses</gold>]</dark_gray> "
  spawn-chat: "<gray>A</gray> <boss> <gray>has appeared nearby...</gray>"
  spawn-actionbar: "<boss> <gray>is somewhere nearby...</gray>"
  spawn-title: "<rank>"
  spawn-subtitle: "<boss> <gray>has appeared!</gray>"
  enraged: "<boss> <red>becomes enraged!</red>"
