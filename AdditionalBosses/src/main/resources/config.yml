  apply-how: "<gray>Hold the equipment in your <white>main hand</white> and the Rune, Relic or Catalyst in your <white>off hand</white>, then run</gray> <white>/bosses apply</white><gray>. You can also pick it up in your inventory and click it onto the item.</gray>"
  second-dawn: "<gold>Second Dawn</gold> <yellow>pulls you back from the brink!</yellow>"
  insomnia: "<dark_purple>Your Insomnia curse won't let you sleep.</dark_purple>"
  butterfingers: "<red>Butterfingers!</red> <gray>You fumbled your item.</gray>"
  guide-received: "<gold>You received the</gold> <yellow>Boss Hunter's Compendium</yellow><gold>. Read it to learn about bosses!</gold>"
  last-stand: "<boss> <dark_red><bold>makes its Last Stand!</bold></dark_red>"
  unstuck: "<boss> <gray>tears itself free!</gray>"
  nemesis-born: "<dark_red>☠</dark_red> <boss> <red>has marked you. It will return.</red>"
  nemesis-grows: "<dark_red>☠</dark_red> <boss> <red>grows stronger from your defeat...</red>"
  nemesis-flee: "<dark_red>☠</dark_red> <boss> <gray>loses your trail... for now.</gray>"
  nemesis-return-title: "<dark_red>☠ NEMESIS ☠</dark_red>"
  nemesis-return-subtitle: "<boss> <gray>has returned for you</gray>"
  nemesis-slain: "<player> <gray>has slain their Nemesis</gray> <boss><gray>!</gray>"
  revenge: "<gold><bold>REVENGE!</bold></gold> <yellow>Bonus rewards for avenging your death.</yellow>"
  escalation-title: "<dark_red><bold>⚠ ESCALATION ⚠</bold></dark_red>"
  escalation-subtitle: "<red>Your hunting has drawn something worse...</red>"
  totem-ritual: "<dark_purple>The totem shudders... something answers.</dark_purple>"
