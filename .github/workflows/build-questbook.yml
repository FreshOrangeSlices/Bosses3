name: Build QuestBook
on:
  push:
    paths:
      - "QuestBook/**"
      - ".github/workflows/build-questbook.yml"
  workflow_dispatch:
defaults:
  run:
    working-directory: QuestBook
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: QuestBook
          path: QuestBook/build/libs/*.jar
          if-no-files-found: error
