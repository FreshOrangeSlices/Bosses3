name: Build plugin
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    working-directory: AdditionalBosses
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v6
        with:
          name: AdditionalBosses
          path: AdditionalBosses/build/libs/*.jar
          if-no-files-found: error
